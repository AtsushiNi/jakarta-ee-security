<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html
    PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:h="http://xmlns.jcp.org/jsf/html"
    xmlns:f="http://java.sun.com/jsf/core" xmlns:p="http://primefaces.org/ui" xmlns:ui="http://xmlns.jcp.org/jsf/facelets">

    <ui:composition template="/templates/template.xhtml">
        <ui:define name="title">login</ui:define>
        <ui:define name="content">
            <h2>Login</h2>
            <h:form>
                <p>
                    <h:outputLabel for="username" value="Username" />
                    <p:inputText id="username" value="#{loginBean.userName}" required="true" />
                </p>

                <p>
                    <h:outputLabel for="password" value="Password" />
                    <p:password id="password" value="#{loginBean.password}" required="true" />
                </p>

                <p:commandButton value="Submit" ajax="false" action="#{loginBean.login}" />
            </h:form>
        </ui:define>
    </ui:composition>

</html>
